        if (viewToggle) {
          viewToggle.addEventListener('click', function () {
            mode = mode === 'mobile' ? 'desktop' : 'mobile';
            try { sessionStorage.setItem('tf:mode', mode); } catch (e) { /* private mode */ }
            layout();
            updateViewToggle();
            var wasMin = document.body.classList.contains('is-min');
            if (wasMin) {
              setMin(false);
              window.clearTimeout(peekTimer);
              peekTimer = window.setTimeout(function () { setMin(true); }, 2000);
            }
          });
        }
      }

      /* ---- colours, live ----
         The card is told, by message, and recolours itself where it stands: no
         reload, so the envelope is not replayed at every swatch. The first
         colour chosen while the envelope is shut opens it, because behind a
         shut envelope nothing visibly changes (the same rule the shop's own
         preview follows). The choice is remembered on the draft so it is on
         the card they buy. */
      var design = {
        key: "mehru-returns",
        palette: {"primary":"#1a110b","secondary":"#e3b366"},
        cardUrl: "/try/mehru-returns/card?v=8c65aac98f"
      };
      var current = null;
      var tray = document.getElementById('tray');
      var paletteBtn = document.getElementById('paletteBtn');
      var origBtn = document.getElementById('origBtn');
      var pending = Promise.resolve();
      var timer = null;

      function varsFor(pair) {
        if (!pair || !window.CIColor || window.CIColor.isOwnPalette(design.palette, pair)) return null;
        return window.CIColor.withArt(design.key, window.CIColor.paletteFrom(pair));
      }
      function tell(open) {
        try {
          card.contentWindow.postMessage({ type: 'ci:palette', vars: varsFor(current), open: !!open }, location.origin);
        } catch (e) { /* the card is still loading; it will say when it is ready */ }
      }
      function mark() {
        if (!tray) return;
        Array.prototype.forEach.call(tray.querySelectorAll('.sw[data-primary]'), function (b) {
          b.classList.toggle('is-on', !!current && b.getAttribute('data-primary').toLowerCase() === String(current.primary).toLowerCase());
        });
        var own = tray.querySelector('.sw.own');
        var isPreset = current && tray.querySelector('.sw[data-primary="' + current.primary + '"]');
        own.classList.toggle('is-on', !!current && !isPreset);
        origBtn.hidden = !current;
      }
      function save() {
        clearTimeout(timer);
        timer = setTimeout(function () {
          pending = fetch('/try/api/colors', {
            method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: design.key, colors: current })
          }).then(function (r) { return r.json(); }).then(function (j) { if (j && j.card) design.cardUrl = j.card; }).catch(function () {});
        }, 350);
      }
      function choose(pair, firstTime) {
        current = pair;
        mark();
        tell(firstTime !== false);
        save();
      }

      /* The card announces itself when it has loaded -- including after a
         refresh -- and is handed whatever colour is chosen. */
      window.addEventListener('message', function (e) {
        if (e.origin !== location.origin || !e.data || e.data.type !== 'ci:preview-ready') return;
        if (current) tell(false);
      });

      if (tray) {
        mark();
        paletteBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var open = tray.hidden;
          tray.hidden = !open;
          paletteBtn.classList.toggle('on', open);
          paletteBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        document.addEventListener('click', function (e) {
          if (!tray.hidden && !tray.contains(e.target) && e.target !== paletteBtn && !paletteBtn.contains(e.target)) {
            tray.hidden = true; paletteBtn.classList.remove('on'); paletteBtn.setAttribute('aria-expanded', 'false');
          }
        });
        tray.addEventListener('click', function (e) {
          var b = e.target.closest('.sw[data-primary]');
          if (b) choose({ primary: b.getAttribute('data-primary'), secondary: b.getAttribute('data-secondary') });
        });
        var picker = tray.querySelector('input[type=color]');
        picker.addEventListener('input', function () {
          var pair = window.CIColor && window.CIColor.pairFor(picker.value);
          if (pair) choose(pair);
        });
        origBtn.addEventListener('click', function () { choose(null, false); });
      }

      /* ---- start again ----
         The card is drawn afresh: shut, at the envelope, with its music
         stopped, as a guest meets it. Any colour change is saved first so the
         fresh card is in the colour they chose. */
      var refreshBtn = document.getElementById('refreshBtn');
      if (refreshBtn) {
        refreshBtn.addEventListener('click', function () {
          refreshBtn.classList.remove('spin'); void refreshBtn.offsetWidth; refreshBtn.classList.add('spin');
          pending.then(function () {
            card.src = design.cardUrl + (design.cardUrl.indexOf('?') > -1 ? '&' : '?') + 'r=' + Date.now();
          });
        });
      }
    })();
  </script>


</body></html>
